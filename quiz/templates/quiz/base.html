{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F1F3FA">
  <title>{% block title %}Quiz de cyberbullying{% endblock %}</title>
  <script>
    /* aplica o tema antes da primeira pintura (evita piscar) */
    (function () {
      var t;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'quiz/style.css' %}">
</head>
<body>
  <main class="wrap">
    <header class="bar">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Tema escuro" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <mask id="moon-mask">
            <rect width="24" height="24" fill="#fff"/>
            <circle class="cut" cx="24" cy="0" r="8" fill="#000"/>
          </mask>
          <circle cx="12" cy="12" r="6" mask="url(#moon-mask)"/>
          <path class="rays" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>
          <circle class="star" cx="18.5" cy="5.5" r="1.1"/>
          <circle class="star s2" cx="21" cy="11" r=".8"/>
        </svg>
      </button>
    </header>
    {% block content %}{% endblock %}
  </main>
  <script>
    (function () {
      var root = document.documentElement,
          btn = document.getElementById("theme-toggle"),
          meta = document.querySelector('meta[name="theme-color"]');
      function apply(t) {
        root.dataset.theme = t;
        btn.setAttribute("aria-pressed", t === "dark");
        if (meta) meta.content = t === "dark" ? "#0F1020" : "#F1F3FA";
      }
      apply(root.dataset.theme);
      btn.addEventListener("click", function () {
        var t = root.dataset.theme === "dark" ? "light" : "dark";
        apply(t);
        try { localStorage.setItem("theme", t); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
